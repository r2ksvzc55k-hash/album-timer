<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDVG — Lukаnn</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55)), url('C92AB1F5-0750-49D8-AAE8-EC4DEDC78AFA.jpeg') no-repeat center center / cover;
      background-color: #121212;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .card {
      background: rgba(15, 15, 20, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .artist {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ff4da6;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 20px;
      color: #e5e5e5;
      font-weight: 500;
    }

    #timer {
      font-size: 26px;
      font-weight: 800;
      margin: 10px 0 28px;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 22px rgba(255, 46, 147, 0.55);
    }

    .btn {
      background: linear-gradient(90deg, #ff2e93, #ff66b2);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 16px;
      display: inline-block;
      box-shadow: 0 8px 25px rgba(255, 46, 147, 0.45);
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="artist">LUKANN — SDVG</div>
    <h1 id="status">До выхода альбома осталось:</h1>
    <div id="timer">00д : 00ч : 00м : 00с</div>
    <a href="https://on.soundcloud.com/5stYzX39fKQrSJgfdi" class="btn" target="_blank">Слушать на SoundCloud</a>
  </div>

  <script>
    // 4 декабря 2026 года, 00:00 по Москве (UTC+3)
    const releaseDate = new Date("2026-12-04T00:00:00+03:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = releaseDate - now;

      if (distance <= 0) {
        document.getElementById("status").innerText = "Альбом готов к выгрузке!";
        document.getElementById("status").style.color = "#ffffff";
        document.getElementById("status").style.fontSize = "24px";
        document.getElementById("timer").style.display = "none";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("timer").innerText =
        `${String(days).padStart(2, '0')}д : ${String(hours).padStart(2, '0')}ч : ${String(minutes).padStart(2, '0')}м : ${String(seconds).padStart(2, '0')}с`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
